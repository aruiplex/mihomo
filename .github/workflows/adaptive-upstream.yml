name: Track formal stable upstream
on:
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: Formal stable upstream tag, blank for latest
        default: ''
permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
concurrency:
  group: adaptive-upstream
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository == 'aruiplex/mihomo'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive/stable
          fetch-depth: 0
      - name: Propose stable upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then tag=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name); fi
          python3 adaptive/update.py --tag "$tag"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: upstream-conflict-${{ github.run_id }}
          path: |
            upgrade-failure.json
            adapter/
            constant/
            hub/
            tunnel/
          if-no-files-found: ignore
      - name: Report actionable upgrade failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Stable upgrade failed; patch retained. Resolve the conflict or runner failure before publishing.\n\nEvidence: %s\n' "$RUN_URL" > failure-body.md
          if [ -z "$(gh issue list --repo aruiplex/mihomo --search 'Adaptive upstream upgrade blocked in:title' --state open --json number --jq '.[0].number // empty')" ]; then
            gh issue create --repo aruiplex/mihomo --title 'Adaptive upstream upgrade blocked' --body-file failure-body.md
          fi
